<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <title>Booking Successful | Ratan Tour & Travel</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial,sans-serif;
        }
        body{
        background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        padding:20px;

        }

        .card{

        background:rgba(255,255,255,.95);
        border-radius:20px;
        padding:40px;
        max-width:600px;
        width:100%;
        text-align:center;
        box-shadow:0 20px 40px rgba(0,0,0,.35);

        animation:fadeIn .8s;

        }

        @keyframes fadeIn{

        from{
        opacity:0;
        transform:translateY(40px);
        }

        to{
        opacity:1;
        transform:translateY(0);
        }

        }

        .icon{

        font-size:90px;
        color:#28a745;
        margin-bottom:20px;

        animation:pop .6s;

        }

        @keyframes pop{

        0%{
        transform:scale(0);
        }

        80%{
        transform:scale(1.2);
        }

        100%{
        transform:scale(1);
        }

        }

        h1{

        color:#222;
        margin-bottom:15px;

        }

        .subtitle{

        font-size:17px;
        color:#666;
        margin-bottom:30px;

        }

        .details{

        text-align:left;
        background:#f5f7fa;
        padding:20px;
        border-radius:12px;
        margin-bottom:25px;

        }

        .details p{

        margin:12px 0;
        font-size:16px;

        }

        .details strong{

        color:#0d6efd;

        }

        .btn{

        display:inline-block;
        padding:15px 30px;
        background:#25D366;
        color:white;
        text-decoration:none;
        border-radius:10px;
        font-size:18px;
        margin:10px;
        transition:.3s;

        }

        .btn:hover{

        background:#128C7E;
        transform:translateY(-3px);

        }

        .home{

        background:#0d6efd;

        }

        .home:hover{

        background:#084298;

        }

        .timer{

        margin-top:20px;
        font-size:17px;
        color:#777;

        }

        .footer{

        margin-top:25px;
        color:#888;
        font-size:14px;

        }

    </style>

</head>

<body>

<div class="card">

    <div class="icon">

        <i class="fas fa-check-circle"></i>

    </div>

    <h1>Booking Confirmed!</h1>

    <p class="subtitle">

        Thank you for choosing <b>Ratan Tour & Travel</b>.

    </p>

    <div class="details">

        <p><strong>Name :</strong> <span th:text="${name}"></span></p>

        <p><strong>Pickup :</strong> <span th:text="${pickup}"></span></p>

        <p><strong>Destination :</strong> <span th:text="${dropLocation}"></span></p>

        <p><strong>Travel Date :</strong> <span th:text="${travelDate}"></span></p>

    </div>

    <a href="#" id="waBtn" class="btn">

        <i class="fab fa-whatsapp"></i>

        Open WhatsApp

    </a>

    <a href="/" class="btn home">

        <i class="fa fa-home"></i>

        Home

    </a>

    <div class="timer">

        Redirecting to WhatsApp in

        <span id="count">3</span>

        seconds...

    </div>

    <div class="footer">

        Need urgent assistance?

        📞 +91 9415787325

    </div>

</div>

<script th:inline="javascript">

    /*<![CDATA[*/

    var name = /*[['${name}']]*/ '';
    var pickup = /*[['${pickup}']]*/ '';
    var drop = /*[['${dropLocation}']]*/ '';
    var date = /*[['${travelDate}']]*/ '';

    var message =
    "Hello Ratan Tour & Travel,%0A%0A" +
    "I have successfully submitted my booking.%0A%0A" +
    "Name : " + name + "%0A" +
    "Pickup : " + pickup + "%0A" +
    "Destination : " + drop + "%0A" +
    "Travel Date : " + date + "%0A%0A" +
    "Please confirm my booking.";

    var whatsapp =
    "https://wa.me/919415787325?text=" +
    encodeURIComponent(message);

    document.getElementById("waBtn").href=whatsapp;

    let count=7;

    let timer=setInterval(function(){

    count--;

    document.getElementById("count").innerHTML=count;

    if(count<=0){

    clearInterval(timer);

    window.location.href=whatsapp;

    }

    },1000);

    /*]]>*/

</script>

</body>

</html>
