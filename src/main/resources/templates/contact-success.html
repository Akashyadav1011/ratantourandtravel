<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="UTF-8">
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <title>Message Sent | Ratan Tour & Travel</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>

        body{
        margin:0;
        font-family:Arial,sans-serif;
        background:linear-gradient(135deg,#0077ff,#00c6ff);
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        }

        .card{

        background:white;
        padding:45px;
        border-radius:18px;
        width:90%;
        max-width:550px;
        text-align:center;
        box-shadow:0 15px 35px rgba(0,0,0,.2);

        }

        .icon{

        font-size:80px;
        color:#28a745;
        margin-bottom:20px;

        }

        h1{

        color:#222;
        margin-bottom:10px;

        }

        p{

        font-size:18px;
        color:#555;
        line-height:1.6;

        }

        .name{

        font-weight:bold;
        color:#0077ff;

        }

        .btn{

        display:inline-block;
        margin-top:25px;
        padding:15px 30px;
        background:#25D366;
        color:white;
        font-size:18px;
        border-radius:10px;
        text-decoration:none;
        transition:.3s;

        }

        .btn:hover{

        background:#128C7E;
        transform:scale(1.05);

        }

        .timer{

        margin-top:20px;
        font-size:16px;
        color:#888;

        }

        .footer{

        margin-top:25px;
        font-size:14px;
        color:#777;

        }

    </style>

</head>

<body>

<div class="card">

    <div class="icon">

        <i class="fa-solid fa-circle-check"></i>

    </div>

    <h1>Thank You!</h1>

    <p>

        Hello

        <span class="name" th:text="${name}"></span>

        Your message has been submitted successfully.

    </p>

    <p>

        Our team will contact you shortly.

    </p>

    <a class="btn"

       th:href="${whatsappUrl}"

       target="_blank">

        <i class="fab fa-whatsapp"></i>

        Chat on WhatsApp

    </a>

    <div class="timer">

        Redirecting to WhatsApp in

        <span id="count">5</span>

        seconds...

    </div>

    <div class="footer">

        Ratan Tour & Travel • Lucknow

    </div>

</div>

<script>

    let time=3;

    let counter=document.getElementById("count");

    let interval=setInterval(function(){

    time--;

    counter.innerHTML=time;

    if(time==0){

    clearInterval(interval);

    window.location.href=document.querySelector(".btn").href;

    }

    },1000);

</script>

</body>

</html>
